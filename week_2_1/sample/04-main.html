<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Content Example</title>
</head>
<body>

  <!-- Repeated on every page — NOT main content -->
  <header>
    <h1>My University</h1>
    <nav>
      <a href="/">Home</a>
    </nav>
  </header>

  <!-- ONE main per page — the unique content -->

    <h2>Web Programming Course</h2>
    <p>This page is about K0126002...</p>
    <!-- Everything unique to this page goes here -->
  </main>

  <!-- Repeated on every page — NOT main content -->
  <footer>
    <p>&copy; 2026 Gachon University</p>
  </footer>

</body>
</html>
