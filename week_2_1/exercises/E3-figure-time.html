<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 3: Figure, Figcaption & Time</title>
</head>
<body>

  <!-- Exercise 3: Create a page with two figures -->
  <!-- Figure 1: Image with alt text and figcaption -->
  <!-- Figure 2: <pre><code> block of HTML skeleton with figcaption -->
  <!-- Between them: a sentence with <time> element showing today's date -->

  <!-- Example provided: -->
  <figure>
    <img src="https://picsum.photos/400/250?random=5"
         alt="Colourful abstract design" width="400" height="250">
    <figcaption>Figure 1: A random placeholder image from picsum.photos.</figcaption>
  </figure>

  <p>The image above was captured on
    <time datetime="2026-09-05">September 5, 2026</time>.
  </p>

  <!-- Your content here: -->
  <!-- Create Figure 1: https://picsum.photos/400/250?random=10 -->
  <!-- Create a sentence with <time> showing today's date -->
  <!-- Create Figure 2: <pre><code> with HTML skeleton -->
  <figure>
    <img src="https://picsum.photos/400/250?random=10"
         alt="Beautiful landscape with mountains and lake" width="400" height="250">
    <figcaption>Figure 1: A scenic landscape photograph from picsum.photos.</figcaption>
  </figure>

  <p>This beautiful landscape was photographed on
    <time datetime="2026-09-13">September 13, 2026</time>.
  </p>

  <figure>
    <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;Page Title&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello, World!&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
    <figcaption>Figure 2: Basic HTML5 document skeleton.</figcaption>
  </figure>

</body>
</html>
