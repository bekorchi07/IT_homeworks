<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 1: Convert Div Soup to Semantic HTML</title>
</head>
<body>

  <!-- Exercise 1: Convert the div soup below to semantic HTML -->
  <!-- Replace each <div class='...'> with the correct semantic element -->

  <header>
    <h1>Gachon Blog</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/posts">Posts</a>
    </nav>
  </header>

  <main>
    <article>
      <h2>My First Post</h2>
      <p>Today I learned about semantic HTML...</p>
    </article>
    <aside>
      <h2>Recent Posts</h2>
      <ul><li>Intro to HTML</li></ul>
    </aside>
  </main>

  <footer><p>&copy; 2026</p></footer>
