<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 6: Fix Semantic Errors</title>
</head>
<body>

  <!-- Exercise 6 (Intermediate): Find and fix all 6 semantic errors in the code below -->
  <!-- Paste this code into your editor, fix the errors, then verify -->

  <!-- Code with 6 errors to fix: -->

  <header>
    <h1>My Blog</h1>
    <nav><a href="/">Home</a></nav>
  </header>
  <main>
    <article>
      <h2>Semantic HTML</h2>
      <figure>
        <img src="img.jpg" alt="Description of blog content image">
        <figcaption>Visual representation of semantic HTML concepts</figcaption>
      </figure>
      <footer>
        <p>Related: <a href="/html">HTML Guide</a></p>
      </footer>
    </article>
    <aside><h2>Topics</h2></aside>
  </main>

  <!-- ERRORS to find and fix:
       1. <h1> should not be in <head> (head is metadata)
       2. <navigation> is not a valid element (use <nav>)
       3. <head> and <body> tags inside body (structural error)
       4. <img> missing alt attribute (accessibility)
       5. <figure> missing <figcaption> (incomplete semantic unit)
       6. <sidebar> is not a valid element (use <aside>)
  -->

  <!-- Correct version: -->
  <!--
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>My Blog</title>
  </head>
  <body>
    <header>
      <h1>My Blog</h1>
      <nav><a href="/">Home</a></nav>
    </header>
    <main>
      <article>
        <h2>Semantic HTML</h2>
        <figure>
          <img src="img.jpg" alt="Description of image">
          <figcaption>Image caption</figcaption>
        </figure>
      </article>
      <aside><h2>Topics</h2></aside>
    </main>
  </body>
  </html>
  -->

</body>
</html>
